<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>LOCUS — UI Prototype</title>
<link rel="icon" type="image/svg+xml" href="../v1/app-icon.svg">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme.css">
<script src="model.js" defer></script>
<script src="screens.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="review-bar">
  <span class="review-name">LOCUS / PROTOTYPE</span>
  <label class="review-picker">Page
    <select id="view" aria-label="Wireframe page">
      <option value="home">Home</option>
      <option value="library">PLAY — Song / chart selection</option>
      <optgroup label="Editor">
        <option value="editor/set">SET</option>
        <option value="editor/route">ROUTE</option>
        <option value="editor/audio">AUDIO</option>
      </optgroup>
      <optgroup label="Skins">
        <option value="skins/path">PATH</option>
        <option value="skins/player">PLAYER</option>
        <option value="skins/colors">COLORS</option>
        <option value="skins/profiles">MY SKINS</option>
      </optgroup>
      <optgroup label="Settings">
        <option value="settings/display">DISPLAY</option>
        <option value="settings/audio">AUDIO / OFFSET</option>
      </optgroup>
      <option value="results">Results — selected attempt</option>
      <option value="play">Gameplay — static reference</option>
      <option value="dialogs">Dialogs</option>
    </select>
  </label>
  <button type="button" class="review-button" id="complete" hidden>Simulate completion</button>
  <button type="button" class="review-button" id="reset">Reset sample</button>
</div>
<div class="stage-holder" id="stageHolder">
  <main class="stage" id="stage" aria-label="LOCUS game window, 960 by 540">
    <div class="screen" id="screen"></div>
    <div class="overlay" id="overlay" hidden>
      <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
    </div>
  </main>
</div>
</body>
</html>
