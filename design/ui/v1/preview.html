<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOCUS — Home / Nightbloom</title>
<style>
:root{color-scheme:dark;--bg:#222638;--surface:#30364F;--text:#F0F1FA;--muted:#ACB6CB;--blue:#A9D8EF;--pink:#B4A3F2;--on:#23243A;--sun:#E5D6A8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 28% 18%,#302e4b,#171b2a 65%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.stage{position:relative;width:min(960px,100%);aspect-ratio:16/9;background:radial-gradient(ellipse at 52% 30%,#3d365c,#242b42 57%,#1e2434);border:1px solid #555b7a;border-radius:26px;overflow:hidden}
.word{position:absolute;left:50%;top:27%;transform:translateX(-50%);width:34.5%}
.menu{position:absolute;top:60%;left:8%;right:8%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
button{font:inherit;cursor:pointer}
.action{min-height:80px;border:1px solid #40414c;border-radius:17px;color:var(--text);background:var(--surface);font-size:18px;font-weight:600;transition:background-color 55ms ease-out,border-color 55ms ease-out,transform 45ms ease-out}
.action.play{background:linear-gradient(120deg,var(--pink),var(--blue));border-color:var(--pink);color:var(--on)}
.action.edit{background:#384762;border-color:var(--blue);color:var(--blue)}
.action.skins{background:#343b57;border-color:#786caa;color:#ded6ff}
.action.settings{background:#3f3c52;border-color:#8c806c;color:var(--sun)}
.action.skins:hover{background:#45496c;border-color:var(--blue)}
.action.settings:hover{background:#55516b;border-color:var(--sun)}
.action:hover:not(.skins):not(.settings){border-color:var(--blue);background:#353741}
.action.play:hover{filter:brightness(1.11)}.action.edit:hover{background:#405b78}
.action:active{transform:translateY(1px) scale(.99)}
button:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
.exit{position:absolute;right:5.6%;bottom:6.7%;width:122px;height:46px;border:1px solid rgba(178,176,184,.46);border-radius:17px;background:#2c3145;color:var(--text);font-size:16px;transition:background-color 55ms ease-out,border-color 55ms ease-out,transform 45ms ease-out}
.exit:hover{background:#3d3c59;border-color:var(--pink)}
.exit:active{transform:translateY(1px)}
.overlay{position:absolute;inset:0;background:var(--bg);display:grid;place-content:center;text-align:center;gap:24px;opacity:0;pointer-events:none;transition:opacity 180ms ease-out}
.overlay.open{opacity:1;pointer-events:auto}
.overlay h2{font-size:30px;margin:0;font-weight:600}
.back{margin:auto;padding:12px 28px;border-radius:15px;border:1px solid #40414c;background:var(--surface);color:var(--text)}
@media(max-width:700px){.stage{aspect-ratio:4/3}.word{top:22%;width:46%}.menu{top:49%;grid-template-columns:repeat(2,1fr)}.action{min-height:52px;font-size:14px}.exit{bottom:3%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<main class="stage" aria-label="LOCUS — главный экран">
<img class="word" src="wordmark.svg" alt="locus.">
<nav class="menu"><button class="action play" data-next="Играть">Играть</button><button class="action edit" data-next="Редактор">Редактор</button><button class="action skins" data-next="Скины">Скины</button><button class="action settings" data-next="Настройки">Настройки</button></nav>
<button class="exit" data-next="Выход">Exit</button>
<section class="overlay" id="overlay"><h2 id="title"></h2><button class="back" id="back">Назад</button></section>
</main>
<script>
const layer=document.getElementById('overlay');
document.querySelectorAll('[data-next]').forEach(button=>button.addEventListener('click',()=>{document.getElementById('title').textContent=button.dataset.next;layer.classList.add('open')}));
function back(){layer.classList.remove('open')}document.getElementById('back').addEventListener('click',back);
document.addEventListener('keydown',event=>{if(event.key==='Escape')back()});
</script></body></html>
