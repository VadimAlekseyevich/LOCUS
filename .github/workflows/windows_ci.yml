name: LOCUS Windows Build and Tests

on:
  push:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "assets/**"
      - "examples/**"
      - "build_and_run.bat"
      - ".github/workflows/windows_ci.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "assets/**"
      - "examples/**"
      - "build_and_run.bat"
      - ".github/workflows/windows_ci.yml"
  workflow_dispatch:

# No private packages, signing certificates, or personal access tokens.
permissions:
  contents: read

jobs:
  windows:
    name: LOCUS + CTest (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure pinned dependencies and test targets
        run: |
          cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 -DLOCUS_BUILD_TESTS=ON -DLOCUS_BUILD_BENCHMARKS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build application and tests (Release)
        run: |
          cmake --build build/windows --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check staged UI manifest and file parity
        run: |
          cmake "-DLOCUS_UI_ASSETS_DIR=build/windows/Release/assets/ui" "-DLOCUS_UI_SOURCE_DIR=assets/ui" -P cmake/verify_ui_assets.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test incremental UI edits, additions and removals
        run: |
          & ./tests/ui_asset_sync.ps1 -BuildDir "build/windows"

      - name: Run all registered CTest cases
        run: |
          $env:LOCUS_SCAN_BENCHMARK_OUTPUT = Join-Path (Get-Location) "build/windows/library-scan-benchmark.csv"
          ctest --test-dir build/windows -C Release --output-on-failure --output-junit build/windows/ctest.xml |
            Tee-Object -FilePath build/windows/ctest-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testOutput = Get-Content build/windows/ctest-output.txt -Raw
          if ($testOutput -notmatch "100% tests passed") {
            throw "CTest did not confirm all tests passed"
          }
          if (-not (Test-Path -LiteralPath $env:LOCUS_SCAN_BENCHMARK_OUTPUT)) {
            throw "Song library stress benchmark metrics missing"
          }
          Get-Content -LiteralPath $env:LOCUS_SCAN_BENCHMARK_OUTPUT

      - name: Profile compiled route snapshots without GPU
        run: |
          & "build/windows/Release/locus_route_preview_bench.exe" |
            Tee-Object -FilePath build/windows/preview-benchmark.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content build/windows/preview-benchmark.txt -Raw
          if (($report | Select-String "PREVIEW_BENCH" -AllMatches).Matches.Count -ne 4) {
            throw "Expected one reported timing per headless route scenario"
          }

      - name: Run headless production and dependency diagnostics
        run: |
          $release = "build/windows/Release"
          $executable = Join-Path $release "locus.exe"
          $checks = @(
            @{ arg = "--loop-check"; expected = "LOOP_STATE_PASS frames=60" },
            @{ arg = "--screen-check"; expected = "SCREEN_STATE_PASS transitions=7" },
            @{ arg = "--session-check"; expected = "SESSION_FLOW_PASS turns=9" }
          )
          $report = @()
          foreach ($check in $checks) {
            $result = & $executable $check.arg
            if ($LASTEXITCODE -ne 0 -or -not ($result -match $check.expected)) {
              throw "Headless app check failed: $($check.arg) / $result"
            }
            $report += $result
          }
          $report | Set-Content build/windows/diagnostics.txt
          $report | ForEach-Object { Write-Output $_ }

      # A portable install is tested from RUNNER_TEMP, outside the checkout.
      - name: Test standalone portable package outside the repository
        run: |
          $package = Join-Path (Get-Location) "build/windows/portable"
          if (Test-Path -LiteralPath $package) { Remove-Item -LiteralPath $package -Recurse -Force }
          cmake --install build/windows --config Release --prefix "$package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake "-DLOCUS_UI_ASSETS_DIR=$package/assets/ui" "-DLOCUS_UI_SOURCE_DIR=assets/ui" -P cmake/verify_ui_assets.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $package "examples/default.locus-skin.json"))) {
            throw "Missing packaged examples"
          }

          $isolated = Join-Path $env:RUNNER_TEMP "LOCUS portable Данила"
          if (Test-Path -LiteralPath $isolated) { Remove-Item -LiteralPath $isolated -Recurse -Force }
          Copy-Item -LiteralPath $package -Destination $isolated -Recurse
          Push-Location $isolated
          try {
            # This headless RmlUi test loads the real HOME, PLAY, EDIT, SETTINGS, SKINS and RESULTS files.
            $layoutTest = Join-Path $env:GITHUB_WORKSPACE "build/windows/Release/locus_rml_layout_tests.exe"
            & $layoutTest
            if ($LASTEXITCODE -ne 0) { throw "Portable UI layout test failed" }
            $result = & (Join-Path $isolated "locus.exe") --screen-check
            if ($LASTEXITCODE -ne 0 -or -not ($result -match "SCREEN_STATE_PASS")) {
              throw "Portable executable screen smoke check failed: $result"
            }
          } finally {
            Pop-Location
          }
          # Test the exact distribution ZIP generated by the local package command.
          cpack --config build/windows/CPackConfig.cmake -C Release -B build/windows/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = "build/windows/dist/LOCUS-windows-x64.zip"
          $unpacked = Join-Path $env:RUNNER_TEMP "LOCUS ZIP Проверка"
          if (Test-Path -LiteralPath $unpacked) { Remove-Item -LiteralPath $unpacked -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $unpacked
          cmake "-DLOCUS_UI_ASSETS_DIR=$unpacked/assets/ui" "-DLOCUS_UI_SOURCE_DIR=assets/ui" -P cmake/verify_ui_assets.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $unpacked "Start LOCUS.bat"))) {
            throw "Portable launcher missing"
          }
          $result = & (Join-Path $unpacked "locus.exe") --screen-check
          if ($LASTEXITCODE -ne 0 -or -not ($result -match "SCREEN_STATE_PASS")) {
            throw "Distribution ZIP executable check failed"
          }
          Write-Output "PORTABLE_UI_PACKAGE_PASS"

      - name: Verify Windows font fallback prerequisites
        run: |
          $fonts = @(
            (Join-Path $env:WINDIR "Fonts/segoeui.ttf"),
            (Join-Path $env:WINDIR "Fonts/arial.ttf")
          )
          $found = $fonts | Where-Object { Test-Path -LiteralPath $_ }
          if (-not $found) {
            Write-Warning "Neither Segoe UI nor Arial exists on this runner. The app falls back to raylib default font."
          } else {
            Write-Output "Windows UI font found; GUI rasterization is NOT tested on this runner."
          }

      # Exercise the actual user-facing BAT as well as the direct CMake build.
      # Reuse the already populated CI tree: no second dependency download.
      - name: Verify Windows launcher, Git diagnostics and ZIP report
        run: |
          $env:LOCUS_SKIP_PULL = "1"
          $env:LOCUS_NO_PAUSE = "1"
          $env:LOCUS_BUILD_DIR = Join-Path (Get-Location) "build/windows"
          & cmd.exe /d /c "call build_and_run.bat build"
          if ($LASTEXITCODE -ne 0) {
            throw "Windows launcher returned failure ($LASTEXITCODE)"
          }
          $archives = @(Get-ChildItem -LiteralPath ".locus-runs" -Filter "LOCUS-game-logs.zip" -Recurse -File)
          if ($archives.Count -ne 1) {
            throw "Windows launcher must produce exactly one diagnostic ZIP"
          }
          $logDir = $archives[0].DirectoryName
          $gitLog = Get-Content -LiteralPath (Join-Path $logDir "git-update.log") -Raw
          $info = Get-Content -LiteralPath (Join-Path $logDir "run-info.txt") -Raw
          if ($gitLog -notmatch "skipped by LOCUS_SKIP_PULL" -or
              $info -notmatch "exit_code=0" -or
              $info -notmatch "mode=build") {
            throw "Windows launcher did not record expected Git/build diagnostics"
          }
          Write-Output "BAT_LAUNCHER_PASS: build=1 git-log=1 diagnostics-zip=1"

      - name: Check clean worktree after the build
        run: |
          $changes = git status --porcelain
          if ($changes) { throw "Generated files leaked into Git worktree: $changes" }
          Write-Output "CLEAN_WORKTREE_PASS"

      # GUI rendering and physical input latency require a real Windows device.
      - name: Upload standalone Windows application
        uses: actions/upload-artifact@v4
        with:
          name: locus-windows-x64
          if-no-files-found: error
          path: build/windows/dist/LOCUS-windows-x64.zip

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locus-windows-diagnostics
          if-no-files-found: error
          path: |
            build/windows/ctest-output.txt
            build/windows/ctest.xml
            build/windows/preview-benchmark.txt
            build/windows/library-scan-benchmark.csv
            build/windows/diagnostics.txt
            build_and_run.bat
