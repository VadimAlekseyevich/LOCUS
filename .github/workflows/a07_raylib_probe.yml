name: A-07 raylib Audio Probe (Windows)

on:
  push:
    paths:
      - "mvp/spikes/raylib_audio/**"
      - "build_and_run.bat"
      - ".github/workflows/a07_raylib_probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-and-size:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout LOCUS
        uses: actions/checkout@v4

      # F-03 checks keep private builds and temporary files out of Git.
      - name: Verify Git ignore rules and reproducible C++ format
        shell: pwsh
        run: |
          $ignored = @(
            "build-a07/probe-log.txt",
            "build/Release/locus.exe",
            "cmake-build-debug/CMakeCache.txt",
            "out/artifact.bin",
            ".locus-runs/a07-session/raylib_probe_log.csv",
            "local-audio/unlicensed.wav",
            "local-charts/my-song.locus.json",
            ".editor-temp/temp.txt",
            "charts/local/draft.locus.json",
            "audio/local/song.wav",
            "draft.locus.json.tmp",
            "draft.locus.json.123.tmp",
            "draft.locus.json.bak",
            "draft.autosave.locus.json",
            "core-ctest.txt",
            "window-smoke.txt",
            "window-smoke-stderr.txt",
            "window-smoke-result.txt",
            "loop-check.txt",
            "screen-check.txt",
            "Thumbs.db"
          )
          foreach ($path in $ignored) {
            git check-ignore -q --no-index -- $path
            if ($LASTEXITCODE -ne 0) { throw "Generated/local path is not ignored: $path" }
          }
          $tracked = @("src/app/main.cpp", "CMakeLists.txt", "mvp/spikes/raylib_audio/main.cpp", "mvp/architecture/CHART_FORMAT.md")
          foreach ($path in $tracked) {
            git check-ignore -q --no-index -- $path
            if ($LASTEXITCODE -eq 0) { throw "Source/documentation unexpectedly ignored: $path" }
          }
          $formatter = Get-Command clang-format -ErrorAction SilentlyContinue
          if ($formatter) {
            $formatterPath = $formatter.Source
          } else {
            $candidates = @(
              "${env:ProgramFiles}\LLVM\bin\clang-format.exe",
              "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\bin\clang-format.exe",
              "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\bin\clang-format.exe"
            )
            $formatterPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $formatterPath) { throw "clang-format not installed on Windows runner" }
          New-Item -ItemType Directory -Force -Path "build-a07" | Out-Null
          $fixture = "build-a07/format-fixture.cpp"
          Set-Content -LiteralPath $fixture -Value 'int main(){if(true){return 0;}return 1;}' -Encoding utf8
          & $formatterPath -i --style=file $fixture
          if ($LASTEXITCODE -ne 0) { throw "First clang-format pass failed" }
          $first = Get-Content -LiteralPath $fixture -Raw
          if (-not $first.Contains("    if (true)")) { throw "Expected 4-space indent from .clang-format was not applied" }
          & $formatterPath -i --style=file $fixture
          if ($LASTEXITCODE -ne 0) { throw "Second clang-format pass failed" }
          $second = Get-Content -LiteralPath $fixture -Raw
          if ($first -cne $second) { throw "clang-format is not idempotent" }
          Write-Output "F03_IGNORE_AND_FORMAT_PASS"

      # Temporary F-01/F-02 verification; F-08 adds dedicated production CI.
      - name: Configure clean F-02 pinned production dependencies
        shell: pwsh
        run: |
          cmake -S . -B build-a07/foundation -G "Visual Studio 17 2022" -A x64 -DLOCUS_BUILD_TESTS=ON -DLOCUS_VERIFY_DEPENDENCIES=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and run production foundation and dependency smoke
        shell: pwsh
        run: |
          cmake --build build-a07/foundation --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = & ".\build-a07\foundation\Release\locus.exe" --foundation-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output | Set-Content foundation-smoke.txt
          Write-Output $output
          if ($output -notmatch "LOCUS foundation built") { throw "F-01 production binary failed its minimal launch check" }
          $deps = & ".\build-a07\foundation\Release\locus_dependencies_smoke.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $deps | Tee-Object -FilePath dependency-smoke.txt
          if (-not ($deps -match "DEPENDENCY_SMOKE_PASS")) { throw "Pinned dependency integration smoke test failed" }

      - name: Verify F-06 state-update loop headlessly
        shell: pwsh
        run: |
          $result = & ".\build-a07\foundation\Release\locus.exe" --loop-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result | Set-Content loop-check.txt
          Write-Output $result
          if ($result -notmatch "LOOP_STATE_PASS frames=60") {
            throw "F-06 loop state update failed"
          }

      - name: Verify production screen switching headlessly
        shell: pwsh
        run: |
          $result = & ".\build-a07\foundation\Release\locus.exe" --screen-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result | Set-Content screen-check.txt
          Write-Output $result
          if ($result -notmatch "SCREEN_STATE_PASS transitions=7") {
            throw "Production screen transitions failed"
          }

      - name: Exercise F-05 blank window open draw and clean shutdown
        shell: pwsh
        run: |
          $exe = (Resolve-Path ".\build-a07\foundation\Release\locus.exe").Path
          $output = Join-Path $PWD "window-smoke.txt"
          $errors = Join-Path $PWD "window-smoke-stderr.txt"
          $process = Start-Process -FilePath $exe -ArgumentList "--window-smoke" -PassThru -RedirectStandardOutput $output -RedirectStandardError $errors
          if (-not $process.WaitForExit(15000)) {
            $process.Kill()
            throw "F-05 window smoke timed out (possible unresponsive window)"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            $detail = Get-Content $errors -Raw -ErrorAction SilentlyContinue
            if ($detail -match "WINDOW_INIT_FAILED") {
              "F05_GUI_UNAVAILABLE_ON_HOSTED_RUNNER" | Set-Content window-smoke-result.txt
              Write-Warning "Hosted Windows runner has no interactive GUI. The owner must manually verify F-05 before it is marked done."
            } else {
              Write-Output $detail
              throw "Unexpected F-05 window failure: exit code $($process.ExitCode)"
            }
          } else {
            $report = Get-Content $output -Raw
            Write-Output $report
            if ($report -notmatch "LOCUS_WINDOW_OPEN" -or
                $report -notmatch "LOCUS_WINDOW_CLOSED" -or
                $report -notmatch "WINDOW_SMOKE_PASS frames=60") {
              throw "F-05 window did not confirm 60 draws and clean shutdown"
            }
            "F05_GUI_SMOKE_PASSED" | Set-Content window-smoke-result.txt
          }

      - name: Run F-04 core tests via CTest
        shell: pwsh
        run: |
          ctest --test-dir build-a07/foundation -C Release --output-on-failure -R "^locus_core_foundation$" |
            Tee-Object -FilePath core-ctest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content core-ctest.txt -Raw
          if ($report -notmatch "1/1 Test" -or $report -notmatch "100% tests passed") {
            throw "Expected exactly one passing core CTest test"
          }

      - name: Configure isolated raylib 6.0 probe
        shell: pwsh
        run: |
          cmake -S mvp/spikes/raylib_audio -B build-a07 -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build-a07 --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run headless WAV validation and exe-size self-test
        shell: pwsh
        run: |
          & ".\build-a07\Release\locus_raylib_audio_spike.exe" --self-test |
            Tee-Object -FilePath windows-self-test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Optional backend audio lifecycle smoke test (no physical audio assertion)
        continue-on-error: true
        shell: pwsh
        run: |
          & ".\build-a07\Release\locus_raylib_audio_spike.exe" --audio-smoke 2>&1 |
            Tee-Object -FilePath windows-audio-smoke.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test double-click Windows BAT launcher (build + self-test)
        shell: cmd
        run: |
          set LOCUS_SKIP_PULL=1
          set LOCUS_NO_PAUSE=1
          call build_and_run.bat test
          if errorlevel 1 exit /b 1
          call build_and_run.bat build
          if errorlevel 1 exit /b 1

      - name: Collect executable and local dependency measurements
        shell: pwsh
        run: |
          $exe = Get-Item ".\build-a07\Release\locus_raylib_audio_spike.exe"
          $dlls = @(Get-ChildItem ".\build-a07\Release" -Filter *.dll -File)
          $dllBytes = ($dlls | Measure-Object -Property Length -Sum).Sum
          if ($null -eq $dllBytes) { $dllBytes = 0 }
          $archive = Get-ChildItem ".\build-a07" -Recurse -Filter raylib.lib -File |
            Select-Object -First 1
          $libBytes = if ($archive) { $archive.Length } else { "not-found" }
          $lines = @(
            "runner_os=$env:RUNNER_OS"
            "runner_image=$env:ImageOS"
            "runner_version=$env:ImageVersion"
            "commit=$env:GITHUB_SHA"
            "compiler=Visual Studio 2022 MSVC x64 Release"
            "raylib_tag=6.0"
            "exe_size_bytes=$($exe.Length)"
            "same_directory_dll_count=$($dlls.Count)"
            "same_directory_dll_bytes=$dllBytes"
            "raylib_static_library_bytes=$libBytes"
            "generated_wav_bytes=$((Get-Item .\metronome.wav).Length)"
            "interactive_audio_playback_tested=false"
            "physical_input_latency_measured=false"
          )
          $lines | Set-Content windows-build-metrics.txt
          Get-Content windows-build-metrics.txt

      - name: Ensure generated files did not dirty the tracked repository
        shell: pwsh
        run: |
          $untracked = git status --porcelain
          if ($untracked) { throw "Build created unignored files: $untracked" }
          Write-Output "F03_CLEAN_WORKTREE_PASS"

      - name: Upload Windows binary and measurement evidence
        uses: actions/upload-artifact@v4
        with:
          name: a07-windows-raylib-audio-probe
          if-no-files-found: error
          path: |
            build_and_run.bat
            build-a07/foundation/Release/locus.exe
            foundation-smoke.txt
            loop-check.txt
            screen-check.txt
            window-smoke.txt
            window-smoke-stderr.txt
            window-smoke-result.txt
            build-a07/foundation/Release/locus_dependencies_smoke.exe
            dependency-smoke.txt
            build-a07/foundation/Release/locus_core_tests.exe
            core-ctest.txt
            build-a07/Release/locus_raylib_audio_spike.exe
            metronome.wav
            windows-build-metrics.txt
            windows-self-test.txt
            windows-audio-smoke.txt
